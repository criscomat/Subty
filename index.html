<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subty</title>

  <style>
    * {
      box-sizing: border-box;
    }

  body {
  margin: 0;
  background: #000;
  color: #ffffff;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #marca {
  position: absolute;
  top: 18px;
  left: 25px;
  font-size: 16px;
  letter-spacing: 4px;
  opacity: 0.5;
}

   #subtitulo {
  width: 94%;
  max-width: 1500px;

  text-align: center;

  font-size: clamp(55px, 8vw, 115px);
  font-weight: 700;

  line-height: 1.08;

  height: 2.25em;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  padding: 0 20px;

  word-break: normal;
  overflow-wrap: break-word;
}

    #microfono {
  position: absolute;
  bottom: 35px;

  width: 72px;
  height: 72px;

  border-radius: 50%;
  border: 1px solid #333;

  background: linear-gradient(145deg, #222, #050505);

  color: white;
  font-size: 30px;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  box-shadow:
    8px 8px 18px #000,
    -4px -4px 10px #333,
    inset 2px 2px 5px #444,
    inset -3px -3px 6px #000;

  transition: all 0.2s ease;
}

#microfono:active {
  transform: scale(0.92);

  box-shadow:
    inset 5px 5px 10px #000,
    inset -2px -2px 5px #333;
}

#microfono.activo {
  border-color: #168cff;

  box-shadow:
    0 0 8px #168cff,
    0 0 20px rgba(22, 140, 255, 0.6),
    8px 8px 18px #000,
    inset 2px 2px 5px #444;
}

#microfono.activo::after {
  content: "";

  position: absolute;

  width: 86px;
  height: 86px;

  border-radius: 50%;

  border: 2px solid rgba(22, 140, 255, 0.5);

  animation: pulso 1.8s infinite;
}

@keyframes pulso {
  0% {
    transform: scale(0.85);
    opacity: 0.8;
  }

  100% {
    transform: scale(1.25);
    opacity: 0;
  }
}

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div id="marca">SUBTY</div>

  <div id="subtitulo">
    Hola, ¿cómo estás?
  </div>

  <button id="microfono" onclick="alternarMicrofono()">
</button>

<script>
let reconocimiento;
let microfonoActivo = false;

function alternarMicrofono() {

  const Reconocimiento =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Reconocimiento) {
    alert("Tu navegador no permite reconocimiento de voz.");
    return;
  }

  const boton = document.getElementById("microfono");

  // APAGAR
  if (microfonoActivo) {
    microfonoActivo = false;

    boton.classList.remove("activo");

    if (reconocimiento) {
      reconocimiento.stop();
    }

    return;
  }

  // ENCENDER
  microfonoActivo = true;

  boton.classList.add("activo");

  reconocimiento = new Reconocimiento();

  reconocimiento.lang = "es-CL";
  reconocimiento.continuous = true;
  reconocimiento.interimResults = true;

  reconocimiento.onresult = function(event) {

    let textoActual = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {
      textoActual += event.results[i][0].transcript;
    }

    textoActual = textoActual.trim();

    if (textoActual !== "") {
      document.getElementById("subtitulo").textContent =
        textoActual;
    }
  };

  reconocimiento.onerror = function(event) {
    console.log("Error:", event.error);
  };

  reconocimiento.onend = function() {

    if (microfonoActivo) {
      try {
        reconocimiento.start();
      } catch (e) {
        console.log("Reconocimiento reiniciado");
      }
    }
  };

  reconocimiento.start();
}

  const reconocimiento = new Reconocimiento();

  reconocimiento.lang = "es-CL";
  reconocimiento.continuous = true;
  reconocimiento.interimResults = true;

  reconocimiento.onresult = function(event) {

    let texto = "";

    // Tomamos solamente el bloque actual
    for (let i = event.resultIndex; i < event.results.length; i++) {
      texto += event.results[i][0].transcript;
    }

    texto = texto.trim();

    if (texto !== "") {
      document.getElementById("subtitulo").textContent = texto;
    }
  };

  reconocimiento.onerror = function(event) {
    console.log("Error:", event.error);
  };

  reconocimiento.onend = function() {
    try {
      reconocimiento.start();
    } catch (e) {
      console.log("Reconocimiento reiniciado");
    }
  };

  reconocimiento.start();
}
</script>

</body>
</html>
