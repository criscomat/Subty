<!DOCTYPE html>
<html lang="es">
</head>
  <link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Subty</title>

  <style>
/* MODO HORIZONTAL */

@media (orientation: landscape) {

  #subtitulo {
    width: 96%;
    max-width: 1800px;

    font-size: clamp(55px, 8vw, 120px);

    min-height: 3.3em;

    padding: 15px 30px;
  }

  #microfono {
    bottom: 20px;
  }

  #marca {
    top: 12px;
    left: 20px;
  }

}
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: "Inter", sans-serif;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #marca {
      position: absolute;
      top: 18px;
      left: 25px;

      font-size: 16px;
      letter-spacing: 4px;
      opacity: 0.45;
    }

    #subtitulo {
  width: 94%;
  max-width: 1500px;

  min-height: 3.3em;

  text-align: center;

  font-size: clamp(65px, 9vw, 125px);

  font-weight: 600;
letter-spacing: -1px;

  line-height: 1.15;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 20px;

  overflow: visible;

  overflow-wrap: break-word;
}

    /* BOTÓN 3D */

    #microfono {
      position: absolute;
      bottom: 35px;

      width: 72px;
      height: 72px;

      border-radius: 50%;
      border: 1px solid #333;

      background:
        linear-gradient(
          145deg,
          #252525,
          #050505
        );

      cursor: pointer;

      box-shadow:
        8px 8px 18px #000,
        -4px -4px 10px #333,
        inset 2px 2px 5px #444,
        inset -3px -3px 6px #000;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    #microfono:active {
      transform: scale(0.92);

      box-shadow:
        inset 5px 5px 10px #000,
        inset -2px -2px 5px #333;
    }

    /* AZUL CUANDO ESTÁ ACTIVO */

    #microfono.activo {
      border-color: #168cff;

      box-shadow:
        0 0 8px #168cff,
        0 0 20px rgba(22, 140, 255, 0.65),
        8px 8px 18px #000,
        inset 2px 2px 5px #444;
    }

    #microfono.activo::after {
      content: "";

      position: absolute;

      top: 50%;
      left: 50%;

      width: 86px;
      height: 86px;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      border:
        2px solid
        rgba(22, 140, 255, 0.5);

      animation: pulso 1.8s infinite;

      pointer-events: none;
    }

    @keyframes pulso {

      0% {
        transform:
          translate(-50%, -50%)
          scale(0.85);

        opacity: 0.8;
      }

      100% {
        transform:
          translate(-50%, -50%)
          scale(1.25);

        opacity: 0;
      }
    }

  </style>

</head>

<body>

  <div id="marca">
    SUBTY
  </div>

  <div id="subtitulo">
    Hola, ¿cómo estás?
  </div>

  <button
    id="microfono"
    aria-label="Activar micrófono"
    onclick="alternarMicrofono()">
  </button>


  <script>

    let reconocimiento = null;
let microfonoActivo = false;
let temporizadorLimpieza = null;


    function crearReconocimiento() {

      const Reconocimiento =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!Reconocimiento) {

        alert(
          "Tu navegador no permite reconocimiento de voz."
        );

        return null;
      }

      const nuevoReconocimiento =
        new Reconocimiento();

      nuevoReconocimiento.lang = "es-CL";

      nuevoReconocimiento.continuous = true;

      nuevoReconocimiento.interimResults = true;


      nuevoReconocimiento.onresult =
        function(event) {

          let texto = "";

          for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
          ) {

            texto +=
              event.results[i][0].transcript;
          }

          texto = texto.trim();

         if (texto !== "") { 
           if (temporizadorLimpieza) {
  clearTimeout(temporizadorLimpieza);
}

            const palabras =
              texto.split(/\s+/);

            const maxPalabras = 8;

            const palabrasVisibles =
              palabras.slice(-maxPalabras);

            document
              .getElementById("subtitulo")
              .textContent =
              palabrasVisibles.join(" ");
           temporizadorLimpieza = setTimeout(() => {

  if (microfonoActivo) {

    document
      .getElementById("subtitulo")
      .textContent = "";

  }

}, 3000);
          }
        };


      nuevoReconocimiento.onerror =
        function(event) {

          console.log(
            "Reconocimiento:",
            event.error
          );
        };


      nuevoReconocimiento.onend =
        function() {

          if (microfonoActivo) {

            try {
              nuevoReconocimiento.start();
            }

            catch (error) {
              console.log(
                "Esperando reinicio..."
              );
            }
          }
        };


      return nuevoReconocimiento;
    }


    function alternarMicrofono() {

      const boton =
        document.getElementById(
          "microfono"
        );


      /* APAGAR */

      if (microfonoActivo) {

        microfonoActivo = false;

        boton.classList.remove(
          "activo"
        );

        boton.setAttribute(
          "aria-label",
          "Activar micrófono"
        );

        if (reconocimiento) {
          reconocimiento.stop();
        }

        return;
      }


      /* ENCENDER */

      reconocimiento =
        crearReconocimiento();

      if (!reconocimiento) {
        return;
      }

      microfonoActivo = true;

      boton.classList.add(
        "activo"
      );

      boton.setAttribute(
        "aria-label",
        "Desactivar micrófono"
      );

      try {

        reconocimiento.start();

      }

      catch (error) {

        console.log(error);

      }
    }

  </script>

</body>
</html>
