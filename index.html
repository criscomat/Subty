<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subty</title>

  <style>
    * {
      box-sizing: border-box;
    }

  body {
  margin: 0;
  background: #000;
  color: #ffffff;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #marca {
  position: absolute;
  top: 18px;
  left: 25px;
  font-size: 16px;
  letter-spacing: 4px;
  opacity: 0.5;
}

    #subtitulo {
      width: 90%;
      text-align: center;
      font-size: clamp(32px, 7vw, 80px);
      font-weight: bold;
      line-height: 1.2;
      min-height: 100px;
    }

    button {
      position: absolute;
      bottom: 35px;
      background: #ffd400;
      color: #000;
      border: none;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div id="marca">SUBTY</div>

  <div id="subtitulo">
    Hola, ¿cómo estás?
  </div>

  <button onclick="escuchar()">🎤 Hablar</button>

<script>
function escuchar() {

  const Reconocimiento =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Reconocimiento) {
    alert("Tu navegador no permite reconocimiento de voz.");
    return;
  }

  const reconocimiento = new Reconocimiento();

  reconocimiento.lang = "es-CL";
  reconocimiento.continuous = true;
  reconocimiento.interimResults = true;

  reconocimiento.onresult = function(event) {

    let texto = "";

    // Tomamos solamente el bloque actual
    for (let i = event.resultIndex; i < event.results.length; i++) {
      texto += event.results[i][0].transcript;
    }

    texto = texto.trim();

    if (texto !== "") {
      document.getElementById("subtitulo").textContent = texto;
    }
  };

  reconocimiento.onerror = function(event) {
    console.log("Error:", event.error);
  };

  reconocimiento.onend = function() {
    try {
      reconocimiento.start();
    } catch (e) {
      console.log("Reconocimiento reiniciado");
    }
  };

  reconocimiento.start();
}
</script>

</body>
</html>
