<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Subty</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* MARCA SUBTY */

    #marca {
      position: absolute;

      top: 18px;
      left: 25px;

      font-size: 16px;
      letter-spacing: 4px;

      opacity: 0.45;
    }


    /* TEXTO PRINCIPAL */

    #subtitulo {

      width: 94%;
      max-width: 1500px;

      height: 2.25em;

      text-align: center;

      font-size: clamp(65px, 9vw, 125px);

      font-weight: 700;

      line-height: 1.05;

      display: -webkit-box;

      -webkit-box-orient: vertical;

      -webkit-line-clamp: 2;

      overflow: hidden;

      text-overflow: ellipsis;

      padding: 0 20px;

      overflow-wrap: break-word;
    }


    /* BOTÓN 3D */

    #microfono {

      position: absolute;

      bottom: 35px;

      width: 72px;
      height: 72px;

      border-radius: 50%;

      border: 1px solid #333;

      background:
        linear-gradient(
          145deg,
          #252525,
          #050505
        );

      cursor: pointer;

      box-shadow:

        8px 8px 18px #000,

        -4px -4px 10px #333,

        inset 2px 2px 5px #444,

        inset -3px -3px 6px #000;

      transition:

        transform 0.2s ease,

        box-shadow 0.2s ease,

        border-color 0.2s ease;

    }


    /* EFECTO AL TOCAR */

    #microfono:active {

      transform: scale(0.92);

      box-shadow:

        inset 5px 5px 10px #000,

        inset -2px -2px 5px #333;

    }


    /* MICRÓFONO ACTIVO */

    #microfono.activo {

      border-color: #168cff;

      box-shadow:

        0 0 8px #168cff,

        0 0 20px rgba(22, 140, 255, 0.65),

        8px 8px 18px #000,

        inset 2px 2px 5px #444;

    }


    /* HALO AZUL */

    #microfono.activo::after {

      content: "";

      position: absolute;

      top: 50%;
      left: 50%;

      width: 86px;
      height: 86px;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      border:
        2px solid
        rgba(22, 140, 255, 0.5);

      animation:
        pulso 1.8s infinite;

      pointer-events: none;

    }


    /* PULSO */

    @keyframes pulso {

      0% {

        transform:
          translate(-50%, -50%)
          scale(0.85);

        opacity: 0.8;

      }

      100% {

        transform:
          translate(-50%, -50%)
          scale(1.25);

        opacity: 0;

      }

    }

  </style>

</head>


<body>


  <!-- MARCA -->

  <div id="marca">
    SUBTY
  </div>


  <!-- TEXTO -->

  <div id="subtitulo">
    Hola, ¿cómo estás?
  </div>


  <!-- BOTÓN -->

 <button
  id="microfono"
  aria-label="Activar micrófono"
  onclick="alternarMicrofono()">
</button>


  <script>

    let reconocimiento = null;

    let microfonoActivo = false;


    /*
      CREAR RECONOCIMIENTO
    */

    function crearReconocimiento() {

      const Reconocimiento =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!Reconocimiento) {

        alert(
          "Tu navegador no permite reconocimiento de voz."
        );

        return null;

      }


      const nuevoReconocimiento =
        new Reconocimiento();


      nuevoReconocimiento.lang = "es-CL";

      nuevoReconocimiento.continuous = true;

      nuevoReconocimiento.interimResults = true;


      /*
        RESULTADO DE VOZ
      */

      nuevoReconocimiento.onresult =
        function(event) {

          let texto = "";


          for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
          ) {

            texto +=
              event.results[i][0].transcript;

          }


          texto = texto.trim();


          if (texto !== "") {

            /*
              Mostramos solamente
              las palabras más recientes.
            */

            const palabras =
              texto.split(/\s+/);


            const maxPalabras = 8;


            const palabrasVisibles =
              palabras.slice(
                -maxPalabras
              );


            document
              .getElementById("subtitulo")
              .textContent =
              palabrasVisibles.join(" ");

          }

        };


      /*
        ERROR
      */

      nuevoReconocimiento.onerror =
        function(event) {

          console.log(
            "Reconocimiento:",
            event.error
          );

        };


      /*
        REINICIO AUTOMÁTICO
      */

      nuevoReconocimiento.onend =
        function() {

          if (microfonoActivo) {

            try {

              nuevoReconocimiento.start();

            }

            catch (error) {

              console.log(
                "Esperando reinicio..."
              );

            }

          }

        };


      return nuevoReconocimiento;

    }


    /*
      BOTÓN
      ENCENDER / APAGAR
    */

   function alternarMicrofono() {

  const boton =
    document.getElementById("microfono");

  if (microfonoActivo) {

    microfonoActivo = false;

    boton.classList.remove("activo");

    if (reconocimiento) {
      reconocimiento.stop();
    }

    return;
  }

  reconocimiento =
    crearReconocimiento();

  if (!reconocimiento) {
    return;
  }

  microfonoActivo = true;

  boton.classList.add("activo");

  reconocimiento.start();
}


        return;

      }


      /*
        ENCENDER
      */

      reconocimiento =
        crearReconocimiento();


      if (!reconocimiento) {

        return;

      }


      microfonoActivo = true;


      boton.classList.add(
        "activo"
      );


      boton.setAttribute(
        "aria-label",
        "Desactivar micrófono"
      );


      try {

        reconocimiento.start();

      }

      catch (error) {

        console.log(error);

      }

    }

  </script>


</body>
</html>
